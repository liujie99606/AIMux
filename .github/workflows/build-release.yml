name: Build Release Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install Inno Setup
        shell: powershell
        run: |
          winget install --id JRSoftware.InnoSetup -e --accept-package-agreements --accept-source-agreements
      - name: Build Windows installer
        shell: powershell
        run: |
          python scripts/build.py --clean
          python scripts/release_installer.py
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AIMux-Windows-Installer
          path: release/AIMux-Setup-*.exe
          if-no-files-found: error

  build-macos:
    name: macOS App
    runs-on: macos-14
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build macOS app
        env:
          AIMUX_PYTHON: python3.13
        run: |
          chmod +x scripts/mac_build.sh scripts/mac_common.sh
          ./scripts/mac_build.sh
      - name: Package macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/AIMux.app AIMux-macOS.zip
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: AIMux-macOS-App
          path: AIMux-macOS.zip
          if-no-files-found: error
