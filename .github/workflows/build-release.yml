name: Build Release Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: powershell
        run: |
          python scripts/build.py --clean
          python scripts/release_installer.py
      - name: Upload Windows installer
        uses: actions/upload-artifact@v5
        with:
          name: AIMux-Windows-${{ matrix.arch }}
          path: release/AIMux-Windows-${{ matrix.arch }}.exe
          if-no-files-found: error

  build-macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build macOS app
        env:
          AIMUX_PYTHON: python3.13
        run: |
          chmod +x scripts/mac_build.sh scripts/mac_common.sh
          ./scripts/mac_build.sh
      - name: Package macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/AIMux.app AIMux-macOS-${{ matrix.arch }}.zip
      - name: Upload macOS app
        uses: actions/upload-artifact@v5
        with:
          name: AIMux-macOS-${{ matrix.arch }}
          path: AIMux-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: AIMux-*
          path: release-assets
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "AIMux $RELEASE_TAG" \
              --generate-notes
          fi
