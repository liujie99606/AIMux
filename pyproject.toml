[project]
name = "aimux"
version = "0.1.0"
description = "A local desktop OpenAI and Anthropic account mux"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "platformdirs>=4.2",
  "pyside6>=6.8",
  "pyqtdarktheme>=2.1.0",
  "sqlmodel>=0.0.22",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pillow>=10.0", "pyinstaller>=6.11", "pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
aimux = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
